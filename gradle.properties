# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Loom 1.18+ requires a JVM 25+ to run the build itself (the mod's
# compiled bytecode still targets Java 17, set via targetJavaVersion in build.gradle).
org.gradle.java.home=C:/Users/Herob/.jdks/openjdk-26.0.2.1
# Tells Loom the Minecraft client/server actually runs on Java 17 (via the
# toolchain below), instead of assuming it runs on the same JDK as Gradle
# itself (26). Without this, Loom thinks it's launching on Java 19+ and
# silently upgrades LWJGL from 3.3.1 to 3.3.2, which Sodium's runtime check
# then rejects as an unsupported build.
fabric.loom.runtimeJavaCompatibilityVersion=17
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.20.1
# Mod Properties
mod_version=1.0-SNAPSHOT
maven_group=PL
archives_base_name=untitled
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.92.12+1.20.1
